<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>欢迎使用功能演示平台</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg: #f4f7fc;
    --text: #1e293b;
    --muted: #64748b;
    --primary-gradient: linear-gradient(135deg, #7b9efb 0%, #5477f2 100%);
  }

  html{
    scroll-behavior:smooth;
    -webkit-text-size-adjust:100%;
  }

  body{
    min-height:100vh;
    background-color:var(--bg);
    background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, transparent 70%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    
    padding: 64px 16px 48px;
    overflow-x: hidden; 
    -webkit-tap-highlight-color:transparent;
  }

  /* 整体容器宽度，控制在 360px 以内 */
  .wrap{
    width:100%;
    max-width:360px; 
    margin:0 auto;
  }

  /* ---------- 头部标题 ---------- */
  .hero{
    text-align:center;
    margin-bottom:36px;
  }

  .hero h1{
    font-size:24px;
    font-weight:700;
    letter-spacing:1px;
    color:var(--text);
  }

  /* ---------- 分区 ---------- */
  .section{margin-bottom:32px}

  .section-title{
    font-size:14px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:12px;
    padding-left:6px;
  }

  /* ---------- 列表 ---------- */
  .list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  /* 外层包裹：处理弥散阴影 */
  .btn-wrapper{
    filter: drop-shadow(0 4px 8px rgba(100, 120, 150, 0.06));
    flex-shrink: 0; 
  }

  /* ---------- 按钮主体 ---------- */
  .btn{
    position: relative;
    display: flex;
    align-items: center;
    padding: 14px 16px; 
    
    /* 👇 核心改动：给未选中的按钮加一个极浅的蓝底色和细边框 */
    background: #f8fbff; 
    box-shadow: inset 0 0 0 1px #dbeafe; 
    
    text-decoration: none;
    color: inherit;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%);
    border-radius: 12px 0 0 12px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    touch-action: manipulation;
  }

  /* 图标容器 */
  .icon-box{
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
    background: var(--icon-bg);
    color: var(--icon-color);
    transition: all 0.3s ease;
  }

  .icon-box svg{
    width: 18px;
    height: 18px;
  }

  /* 文字内容区 */
  .content{
    margin-left: 12px;
    flex: 1;
    min-width: 0;
  }

  .title-row{
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 2px;
  }

  .content h3{
    font-size: 14px; 
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.3s;
  }

  /* 标签 */
  .tag{
    font-size: 10px;
    font-weight: 500;
    padding: 2px 5px;
    border-radius: 4px;
    background: #ffffff;
    color: var(--muted);
    border: 1px solid #e2e8f0;
    flex-shrink: 0;
    transition: all 0.3s;
  }

  .desc{
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.3s;
  }

  /* 右侧箭头 */
  .arrow{
    display: flex;
    color: #cbd5e1;
    margin-left: 8px;
    flex-shrink: 0;
    transition: all 0.3s ease;
  }

  .arrow svg{
    width: 14px;
    height: 14px;
  }

  /* ====================================================
     鼠标悬停态（桌面端）
     ==================================================== */
  @media (hover: hover) and (pointer: fine) {
    .btn-wrapper:hover {
      filter: drop-shadow(0 8px 20px rgba(84, 119, 242, 0.35));
    }
    .btn-wrapper:hover .btn {
      background: var(--primary-gradient);
      box-shadow: none; /* 悬停时去掉内边框 */
      transform: translateX(4px); 
    }
    .btn-wrapper:hover .icon-box {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }
    .btn-wrapper:hover .content h3,
    .btn-wrapper:hover .desc,
    .btn-wrapper:hover .arrow {
      color: #ffffff;
    }
    .btn-wrapper:hover .arrow {
      transform: translateX(2px);
    }
    .btn-wrapper:hover .tag {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
    }
  }

  /* ====================================================
     触摸按压态（手机端反馈）
     ==================================================== */
  .btn:active {
    background: var(--primary-gradient) !important;
    box-shadow: none !important;
    transform: scale(0.97) translateX(2px);
  }
  /* 按下时内部文字和图标变白 */
  .btn:active .icon-box { background: rgba(255,255,255,0.2) !important; color: #fff !important; }
  .btn:active .content h3, .btn:active .desc, .btn:active .arrow { color: #fff !important; }

  .btn:focus-visible {
    outline: 2px solid #5477f2;
    outline-offset: 2px;
  }

  /* ---------- 页脚 ---------- */
  .foot{
    margin-top: 48px;
    text-align: center;
    font-size: 12px;
    color: #94a3b8;
  }

  /* ====================================================
     手机端适配
     ==================================================== */
  @media (max-width: 640px) {
    body { padding: 40px 16px 32px; }
    .hero { margin-bottom: 28px; }
    .hero h1 { font-size: 22px; }
    .wrap { max-width: 330px; }
    .tag { display: none; }
  }
</style>
